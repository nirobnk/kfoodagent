# fly.toml — deploy with: fly launch --no-deploy && fly deploy
# Secrets:  fly secrets set WA_ACCESS_TOKEN=... SUPABASE_SERVICE_ROLE_KEY=... (etc)
app = "kfood-whatsapp-agent"
primary_region = "sin"   # Singapore: closest Fly region to Sri Lanka

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false      # the webhook must answer Meta immediately
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
