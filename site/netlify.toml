# K FOOD — Netlify config

# The site lives in site/ of the kfoodagent repo, beside backend/ and
# dashboard/. When Netlify is linked to the repo, set Base directory = site in
# the UI; this file is then read from here. The HTML is committed already
# (build.mjs is run by hand), so there is no build command.
#
# ignore: a push that touches only backend/ or dashboard/ must not redeploy
# the shop. Exit 0 = nothing changed under site/, skip the build.
[build]
  publish = "."
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS are versioned with ?v=N, but revalidate every load so a stale
# cart.js can never linger in a customer's browser after a deploy.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/javascript; charset=utf-8"

# www -> apex
[[redirects]]
  from = "https://www.kfoods.lk/*"
  to = "https://kfoods.lk/:splat"
  status = 301
  force = true
